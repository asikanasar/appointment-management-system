name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17 for Spring Boot
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build Backend (Spring Boot)
      - name: Build Backend
        working-directory: appointment
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      # 4️⃣ SonarCloud Analysis (Backend)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: appointment
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: asikansar_appointment-management-system
          SONAR_ORGANIZATION: ASIKA M

      # 5️⃣ Set up Node.js for React
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 6️⃣ Build Frontend (React)
      - name: Build Frontend
        working-directory: appointment-frontend
        run: |
          npm install
          npm run build
